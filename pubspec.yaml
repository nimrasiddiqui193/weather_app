
name: weather_app
description: "Weatherly weather application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/weatherly_icon.png"
  adaptive_icon_background: "#102889"
  adaptive_icon_foreground: "assets/icon/weatherly_icon.png"

flutter:
  uses-material-design: true
